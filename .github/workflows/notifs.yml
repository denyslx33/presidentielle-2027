name: Sondages allégés et alertes
# Tourne sur les serveurs de GitHub (gratuit pour un dépôt public). Aucune IA, rien sur l'iMac.
on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_run:
    workflows: ["Fil d'actu"]
    types: [completed]
  push:
    branches: [main]
    paths: ["data/actu.json", "data/agenda.json", "data/ajouts.csv"]
  workflow_dispatch:
    inputs:
      test:
        description: "Alerte d'essai (laisser vide pour un passage normal)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: notifs
jobs:
  notifs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !inputs.test }}
        run: python3 .github/scripts/sondages.py || true
      - if: ${{ !inputs.test }}
        run: python3 .github/scripts/reserve.py || true
        env:
          PUSH_API: ${{ vars.PUSH_API }}
          SEND_TOKEN: ${{ secrets.SEND_TOKEN }}
      - run: python3 .github/scripts/notifs.py
        env:
          PUSH_API: ${{ vars.PUSH_API }}
          SEND_TOKEN: ${{ secrets.SEND_TOKEN }}
          TEST_MSG: ${{ inputs.test }}
      - run: |
          for f in data/sondages.csv data/notifs-etat.json data/notifs-stats.json data/candidats.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git -c user.name="denyslx33" -c user.email="denyslx33@users.noreply.github.com" commit -qm "Sondages et alertes automatiques"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
