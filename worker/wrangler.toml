name = "nousvotons-push"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Base de données des abonnés (gratuite, Cloudflare D1)
[[d1_databases]]
binding = "DB"
database_name = "nousvotons-push"
database_id = "b4559664-329c-4267-8358-bb0834a95317"

[vars]
# Adresse de l'app autorisée à s'abonner
ALLOWED_ORIGIN = "https://denyslx33.github.io"
VAPID_SUBJECT = "mailto:denyslx.pro@gmail.com"
VAPID_PUBLIC = "BJEbVp5yTeOJzm_kVrmUVwPSL5dKHQF3Ufd8Qf57o1LJRcnqjW-bNTX_Gm9qxdSCTGcaOb7FQ0TbLGw-09a_m1g"
# Secrets à créer avec « wrangler secret put » (jamais dans ce fichier) :
#   VAPID_PRIVATE  : clé privée VAPID (format JWK d, base64url)
#   SEND_TOKEN     : mot de passe que la GitHub Action utilise pour envoyer

[triggers]
crons = ["*/15 * * * *"]  # réveil de GitHub toutes les 15 minutes
# secret supplémentaire : GH_TOKEN (wrangler secret put GH_TOKEN)
